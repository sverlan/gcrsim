}

sub ver1_next($$){
my ($s, $c) = @_;
#use Audio::Beep;
#beep(440,2000);
  if (/^
       (A|C|B|D|c)* 
	   (
	   \$(E|X|Y|Z|S|U|B|A|C|B|D|K|L|O|R) |  
	   \#(P|Q|V)
	   )* 
	   $
	   /x and $c==0){
    my $x = $c+1;
    print "!!Terminal!!:$_ ($x)\n"; 
 #   beep(440,1000);
  }
  return 1;
}