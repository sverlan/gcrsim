sub filter_next($$){
  return &ver1_next ;
}

sub ver1_next($$){
my ($s, $c) = @_;
$c++;

#print "----$s-----$c----";

return 0 if /(e.).*\1.*\1/;
return 0 if /(f.).*\1.*\1/;
return 0 if /e\d\d/;
return 0 if /f\d\d/;


print "Terminal?: $s\n" if /^[a\$ABY]+$/ and $c==1;


return 1;
}