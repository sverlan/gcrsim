name: release

# Runs only when a version tag vX.Y.Z is pushed. It checks that the tag is the version of the package, runs the tests,
# builds the package and uploads it to PyPI with trusted publishing (no token is stored; see the setup in the
# project's release notes: PyPI project "gcrsim", workflow "release.yml", environment "pypi").
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.12"
          enable-cache: true
      - name: the tag must be the version of the package
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: uv run --locked python -m pytest -q
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.12"
          enable-cache: false   # this job has no checkout, so there is nothing to key a cache on
      - run: uv publish --trusted-publishing always dist/*
